apiVersion: v1
kind: Service
metadata:
  name: heart-api
  labels:
    app: heart-api
spec:
  type: NodePort
  selector:
    app: heart-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30050
---
# Optional: LoadBalancer variant for Docker Desktop (uncomment to use).
# Docker Desktop assigns the LoadBalancer to localhost:80 automatically.
