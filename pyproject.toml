[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "mlruns", "models/mlflow_model", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"unit_test/*" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["unit_test"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
